[project]
name = "wlkngkr"
version = "0.1.2"
description = "Modular environment probe framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Christian Prior-Mamulyan", email = "cprior@gmail.com" },
]
keywords = [
    "environment",
    "probe",
    "diagnostics",
    "cli",
    "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12.3",
]

[project.urls]
Homepage = "https://github.com/cprima-forge/cpmf-uiprc-diag"
Documentation = "https://github.com/cprima-forge/cpmf-uiprc-diag/tree/develop/docs"
Source = "https://github.com/cprima-forge/cpmf-uiprc-diag"
Issues = "https://github.com/cprima-forge/cpmf-uiprc-diag/issues"
Changelog = "https://github.com/cprima-forge/cpmf-uiprc-diag/blob/develop/CHANGELOG.md"

[project.scripts]
wlkngkr = "wlkngkr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
