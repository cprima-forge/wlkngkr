[project]
name = "wlkngkr"
version = "0.1.0"
description = "Modular environment probe framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "cprima", email = "example@example.com" },
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12.3",
]

[project.scripts]
wlkngkr = "wlkngkr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
